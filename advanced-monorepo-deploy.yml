# name: Advanced, feature-rich workflow for monorepo CI + Docker deploy
name: Advanced Monorepo CI & Deploy

# on: Multiple triggers including manual dispatch (workflow_dispatch)
on:
  push:
    branches: ["main"] # run on pushes to main
  pull_request:
    branches: ["main"] # validate PRs to main
  workflow_dispatch: # manual trigger with inputs
    inputs:
      deploy:
        description: "Deploy after build?"
        type: boolean
        default: false
      image_tag:
        description: "Docker image tag (for manual deploys)"
        type: string
        default: "manual"

# concurrency: Cancel in-progress runs for the same ref to reduce noise
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# permissions: Scope token to least privilege needed
permissions:
  contents: read
  packages: write # needed to push Docker images to GHCR
  id-token: write  # for OIDC to cloud providers (optional)

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
      frontend_changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3 # compute which areas changed
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend-tests:
    name: Backend Tests (with DB)
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_changed == 'true' # run only if backend changed
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16 # service container for tests
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install deps
        working-directory: backend
        run: npm ci
      - name: Run DB migrations
        working-directory: backend
        run: npm run migrate --if-present
      - name: Test
        working-directory: backend
        run: npm test -- --ci

  frontend-build:
    name: Frontend Build
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend_changed == 'true' # run only if frontend changed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  docker-build-push:
    name: Docker Build & Push (GHCR)
    needs: [detect-changes, backend-tests]
    if: >-
      (needs.detect-changes.outputs.backend_changed == 'true') &&
      (github.event_name == 'push' || github.event.inputs.deploy == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=${{ github.event.inputs.image_tag || 'latest' }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Production
    needs: docker-build-push
    environment:
      name: production # hooks into GitHub Environments for approvals/secrets
      url: https://example.com
    if: github.event_name == 'push' || github.event.inputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: |
          echo "Deploying backend image to production..."
          # Replace with your deployment commands (kubectl, helm, terraform, etc.)
